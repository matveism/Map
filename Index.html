<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moving Bike Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #topbar {
      padding: 10px;
      background: #000;
      text-align: center;
      z-index: 1000;
      position: relative;
    }
    #map {
      width: 100%;
      height: calc(100vh - 50px);
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 6px;
      background: #0a84ff;
      color: white;
    }
    #status {
      margin-top: 6px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div id="topbar">
    <button id="startBtn">Start Bike 🚲</button>
    <div id="status">Tap Start to begin.</div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const statusEl = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");

    const fallbackCenter = [37.7749, -122.4194];

    const map = L.map("map").setView(fallbackCenter, 18);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19
    }).addTo(map);

    // BIGGER BIKE ICON (64x64)
    const bikeIcon = L.divIcon({
      html: '<div style="font-size:64px;">🚲</div>',
      className: "",
      iconSize: [64, 64],
      iconAnchor: [32, 32]
    });

    let bikeMarker = L.marker(fallbackCenter, { icon: bikeIcon }).addTo(map);

    let geoWatchId = null;
    let fakeInterval = null;
    let fakeAngle = 0;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function startFakeMovement(center) {
      if (fakeInterval) return;
      setStatus("GPS blocked. Simulating bike movement…");

      const radius = 0.0005;

      fakeInterval = setInterval(() => {
        fakeAngle += 0.05;
        const lat = center[0] + radius * Math.sin(fakeAngle);
        const lng = center[1] + radius * Math.cos(fakeAngle);
        const pos = [lat, lng];

        bikeMarker.setLatLng(pos);
        map.setView(pos, 18);
      }, 250);
    }

    function stopFakeMovement() {
      if (fakeInterval) {
        clearInterval(fakeInterval);
        fakeInterval = null;
      }
    }

    function onGeoSuccess(pos) {
      stopFakeMovement();

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      const loc = [lat, lng];

      setStatus(`GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(acc)}m)`);

      bikeMarker.setLatLng(loc);
      map.setView(loc, 18);
    }

    function onGeoError(err) {
      setStatus("GPS error: " + err.message);
      startFakeMovement(fallbackCenter);
    }

    function startBike() {
      setStatus("Starting…");

      if (geoWatchId !== null) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }

      stopFakeMovement();

      if (!("geolocation" in navigator)) {
        setStatus("No GPS. Simulating movement.");
        startFakeMovement(fallbackCenter);
        return;
      }

      geoWatchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 8000
      });
    }

    startBtn.addEventListener("click", startBike);
  </script>

</body>
</html>
