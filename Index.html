<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Moving Bike Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background: #111;
      color: #fff;
    }
    #topbar {
      padding: 10px;
      text-align: center;
      background: #000;
      position: relative;
      z-index: 1000;
    }
    #map {
      width: 100%;
      height: calc(100vh - 50px);
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #0a84ff;
      color: #fff;
    }
    #status {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <button id="startBtn">Start Bike 🚲</button>
    <div id="status">Tap "Start Bike" to begin.</div>
  </div>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');

    // Initial center (fallback: somewhere visible)
    const fallbackCenter = [37.7749, -122.4194]; // SF

    // Create map
    const map = L.map('map').setView(fallbackCenter, 18); // zoomed in

    // Tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Bike icon using emoji
    const bikeIcon = L.divIcon({
      html: '🚲',
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16]
    });

    let bikeMarker = L.marker(fallbackCenter, { icon: bikeIcon }).addTo(map);

    let geoWatchId = null;
    let fakeInterval = null;
    let fakeAngle = 0;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function startFakeMovement(center) {
      if (fakeInterval) return;
      setStatus('GPS not available. Simulating bike movement.');
      const radius = 0.0005; // ~50m
      fakeInterval = setInterval(() => {
        fakeAngle += 0.05;
        const lat = center[0] + radius * Math.sin(fakeAngle);
        const lng = center[1] + radius * Math.cos(fakeAngle);
        const latlng = [lat, lng];
        bikeMarker.setLatLng(latlng);
        map.setView(latlng, 18);
      }, 300);
    }

    function stopFakeMovement() {
      if (fakeInterval) {
        clearInterval(fakeInterval);
        fakeInterval = null;
      }
    }

    function onGeoSuccess(pos) {
      stopFakeMovement();
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;
      const latlng = [lat, lng];

      setStatus(`GPS: ${lat.toFixed(5)}, ${lng.toFixed(5)} (±${Math.round(acc)}m)`);

      bikeMarker.setLatLng(latlng);
      map.setView(latlng, 18);
    }

    function onGeoError(err) {
      setStatus('GPS error: ' + err.message + ' — using simulated bike path.');
      startFakeMovement(fallbackCenter);
    }

    function startBike() {
      setStatus('Starting…');

      // Clear previous
      if (geoWatchId !== null) {
        navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
      }
      stopFakeMovement();

      if (!('geolocation' in navigator)) {
        setStatus('Geolocation not supported. Simulating bike movement.');
        startFakeMovement(fallbackCenter);
        return;
      }

      // Need user gesture (button click) before this in WKWebView/Koder
      geoWatchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 8000
      });
    }

    startBtn.addEventListener('click', startBike);
  </script>
</body>
</html>
